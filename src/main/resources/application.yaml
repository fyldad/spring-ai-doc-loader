server.port: 0
file:
  supplier:
    directory: C:\Users\User\IdeaProjects
    # Prefer explicit IDs/roots when indexing named repositories. When this list is
    # absent, directory accepts a project root or a folder of project directories.
    # repositories:
    #   - id: customer-services
    #     root: C:\projects\customer-services
    filename-regex: (?i).*\.(java|xml|wsdl|xsd|md|txt|yaml|yml|properties)
    excluded-directories: .git,.gradle,.idea,build,target,node_modules
    excluded-path-parts: WEB-INF, META-INF, .gitlab-ci.yml
    respect-gitignore: true
    exclude-generated: false
    exclude-tests: true
    max-file-size: 2097152 # bytes; bounds both discovery and the actual read
    encoding: UTF-8 # fallback; BOMs and XML encoding declarations take precedence
    report: build/reports/discovery.csv
ingestion:
  writer:
    state-file: loaded.txt # successful file checkpoints; delete to force a full reload
    batch-size: 32 # chunks per write, combined across files; final partial batch is also written
    concurrency: 2 # maximum simultaneous embedding/storage calls; use 1 for serial writes
  xml:
    max-import-depth: 16
    max-import-files: 128
    element-names: [bean, route, endpoint]
    maven-resolution-policy: declared
  chunks:
    max-tokens: 1200 # conservative UTF-8/NFKC bound, including the repeated header
  java:
    language-level: JAVA_17
    resolve-symbols: false # enable with local source roots/JARs; never builds repositories
    source-roots: []
    dependency-jars: []
  qdrant:
    payload-indexes: true
spring:
  application.name: spring-ai-doc-loader
  ai.vectorstore.qdrant.initialize-schema: true
  cloud.function.definition: fileTreeSupplier|documentReader|splitDocuments|vectorStoreWriter

  ai:
    ollama:
#      base-url: http://localhost:11434
      embedding:
        model: bge-m3
        truncate: false # surface an input-limit mismatch instead of losing source silently

logging:
  level:
    root: info
